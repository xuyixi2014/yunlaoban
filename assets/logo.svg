<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4b8bff"/>
      <stop offset=".5" stop-color="#2f6fed"/>
      <stop offset="1" stop-color="#1c4fb8"/>
    </linearGradient>
    <linearGradient id="tie" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ff7a6b"/>
      <stop offset="1" stop-color="#e5484d"/>
    </linearGradient>
  </defs>
  <!-- 徽章背景 -->
  <rect x="2" y="2" width="60" height="60" rx="16" fill="url(#bg)"/>
  <ellipse cx="20" cy="14" rx="24" ry="14" fill="#ffffff" opacity=".12"/>
  <!-- 云朵 -->
  <g fill="#ffffff">
    <circle cx="17" cy="17" r="6.2"/>
    <circle cx="26" cy="13" r="7.6"/>
    <circle cx="35" cy="17" r="6"/>
    <rect x="15" y="15" width="22" height="9" rx="4.5"/>
  </g>
  <!-- 老板：头部 -->
  <circle cx="31" cy="35" r="11" fill="#ffdcb6"/>
  <!-- 头发 -->
  <path d="M20 33 a11 11 0 0 1 22 0 l0 -1.6 a11 11 0 0 0 -22 0 z" fill="#3d2d23"/>
  <!-- 太阳镜 -->
  <rect x="21.5" y="32" width="19" height="6" rx="3" fill="#1f2733"/>
  <rect x="30" y="33.2" width="2.2" height="1.6" fill="#1f2733"/>
  <!-- 微笑 -->
  <path d="M27 43 q4 3 8 0" fill="none" stroke="#c97a2a" stroke-width="1.7" stroke-linecap="round"/>
  <!-- 领结 -->
  <rect x="28.6" y="46" width="4.8" height="3.6" rx="1.5" fill="url(#tie)"/>
  <!-- 领带带身 -->
  <path d="M28.6 49.4 L33.4 49.4 L31 60 Z" fill="url(#tie)"/>
</svg>
